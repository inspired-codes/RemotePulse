# Keeps the SHA-pinned GitHub Actions and the NuGet packages current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Major versions (e.g. .NET 11 packages) are a deliberate upgrade, not a routine bump.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
